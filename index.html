<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
</head>
<body>
    <div class="container">
        <div class="input-container">
            <label for="city-name"></label>
            <input type="text" id="city-name" name="city-name" title="city-name" placeholder="Enter City Name"/>
            <span class="material-symbols-outlined">search</span>
        </div>
        <section class="info-section">
          <div class="main-weather-icon">
            <img src="/assets/assets/weather/clouds.svg" alt="Clouds">
          </div>
          <div class="main-weather-info">
            <h2 class="city-name">Tokyo</h2>
            <h1 class="temperature">25°C</h1>
            <h3 class="weather-condition">Cloudy</h3>
          </div>  
        </section>
        <section class="additional-main-info">
            <div class="additional-info">
                <h3 class="humidity">Humidity:<span class="additional-info-value">6%</span></h3>
                <h3 class="precipitation">Precipitation: <span class="additional-info-value">30%</span></h3>
            </div>
        </section>
        <section class="forecast-container">
            <div class="forecast-card">
                <p class="forecast-days">Monday</p>
                <img src="/assets/assets/weather/clouds.svg" alt="Clouds">
                <p class="forecast-condition">Clouds</p>
            </div>
            <div class="forecast-card">
                <p class="forecast-days">Tuesday</p>
                <img src="/assets/assets/weather/clear.svg" alt="Sunny">
                <p class="forecast-condition">Clear</p>
            </div>
            <div class="forecast-card">
                <p class="forecast-days">Wednesday</p>
                <img src="/assets/assets/weather/rain.svg" alt="Rainy">
                <p class="forecast-condition">Rain</p>
            </div>
            <div class="forecast-card">
                <p class="forecast-days">Thursday</p>
                <img src="/assets/assets/weather/clouds.svg" alt="Clouds">
                <p class="forecast-condition">Clouds</p>
            </div>
            <div class="forecast-card">
                <p class="forecast-days">Friday</p>
                <img src="/assets/assets/weather/clear.svg" alt="Sunny">
                <p class="forecast-condition">Clear</p>
            </div>
        </section>
    </div>
    <script src="config.js"></script>
    <script src="main.js"></script>
    
</body>
</html>
